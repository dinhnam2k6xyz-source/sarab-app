version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: novel_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: novel_translator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - novel_network

  redis:
    image: redis:7-alpine
    container_name: novel_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - novel_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/novel_translator
      - REDIS_URL=redis://redis:6379/0
      - TRANSLATION_PROVIDER=${TRANSLATION_PROVIDER:-gemini}
      - FALLBACK_PROVIDER=${FALLBACK_PROVIDER:-offline}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-novel-translator-super-secret-key-prod-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novel_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel_worker
    restart: always
    command: ["celery", "-A", "app.queue.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/novel_translator
      - REDIS_URL=redis://redis:6379/0
      - TRANSLATION_PROVIDER=${TRANSLATION_PROVIDER:-gemini}
      - FALLBACK_PROVIDER=${FALLBACK_PROVIDER:-offline}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-novel-translator-super-secret-key-prod-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novel_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novel_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - novel_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  novel_network:
    driver: bridge
